services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: boardflow-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: boardflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boardflow

    ports:
      - "5432:5432"

    volumes:
      - boardflow_postgres_data:/var/lib/postgresql/data

volumes:
  minio_data:
  boardflow_postgres_data:
