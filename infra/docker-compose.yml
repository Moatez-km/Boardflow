services:
  postgres:
    image: postgres:16-alpine
    container_name: boardflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardflow
      POSTGRES_PASSWORD: boardflow_password
      POSTGRES_DB: boardflow
    ports:
      - "5432:5432"
    volumes:
      - boardflow_postgres_data:/var/lib/postgresql/data

volumes:
  boardflow_postgres_data:
